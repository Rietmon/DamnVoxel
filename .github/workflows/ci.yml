name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and layers
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Tests with coverage thresholds for the core
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Bundle size against the budget in docs/stack.md
        run: pnpm size
